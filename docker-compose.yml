services:
  kafka:
    # ... tu configuración actual de kafka ...
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,INTERNAL://kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qz'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  akhq:
    # ... tu configuración actual de akhq ...
    image: tchiotludo/akhq:latest
    container_name: akhq
    ports:
      - "8083:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka:9093"
    depends_on:
      - kafka

  worker:
    build: . # O especifica la ruta de tu Dockerfile
    container_name: rust_worker
    restart: always
    environment:
      # IMPORTANTE: Dentro de docker, el worker usa el puerto interno 9093
      - KAFKA_BOOTSTRAP_SERVER=kafka:9093 
      - MONGO_URI=${MONGO_URI}
      - MINIO_SERVER_HOST=${MINIO_SERVER_HOST}
    volumes:
      - ./uploads:/app/uploads # Esto mapea tu carpeta local al contenedor
    depends_on:
      - kafka